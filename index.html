<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光正‧拾光卡｜69道光，陪你走一段路。</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4efe7;
  --paper:#faf7f1;
  --text:#554c43;
  --muted:#8c8175;
  --accent:#a88f78;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
  overflow-x:hidden;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  width:100%;
  height:100vh;
  min-height:720px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.72),
      rgba(244,239,231,.95) 55%,
      #eee7dc 100%
    );
}

.hero-content{
  position:absolute;
  z-index:20;
  top:6vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:90%;
  pointer-events:none;
}

.kicker{
  font-size:13px;
  letter-spacing:.28em;
  color:var(--muted);
  margin-bottom:12px;
}

.title{
  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PMingLiU",
    serif;
  font-size:clamp(30px,4vw,52px);
  font-weight:500;
  letter-spacing:.12em;
  color:#51483f;
}

.subtitle{
  margin-top:12px;
  font-size:14px;
  letter-spacing:.18em;
  color:#94887c;
}

.hint{
  margin-top:15px;
  font-size:12px;
  letter-spacing:.14em;
  color:#aa9d90;
}

/* =========================
   CARD FAN
========================= */

.fan-area{
  position:absolute;
  left:0;
  right:0;
  bottom:-4vh;
  top:18vh;
  overflow:visible;
  perspective:1800px;
}

.fan{
  position:absolute;
  inset:0;
  overflow:visible;
}

/*
  每張牌：
  高度約 50vh
  寬度依 9:16 比例計算
*/
.fan-card{
  position:absolute;

  height:50vh;
  width:calc(50vh * 9 / 16);

  left:50%;
  top:58%;

  border-radius:8px;
  overflow:hidden;

  background:#eee8df;

  box-shadow:
    0 12px 28px rgba(75,62,48,.16),
    0 3px 8px rgba(75,62,48,.10);

  cursor:pointer;

  transform-origin:50% 92%;

  transition:
    transform .65s cubic-bezier(.2,.8,.2,1),
    filter .35s ease,
    box-shadow .35s ease;

  will-change:transform;

  user-select:none;
  -webkit-user-select:none;
}

.fan-card:hover{
  filter:brightness(1.04);
  box-shadow:
    0 18px 35px rgba(75,62,48,.22),
    0 5px 12px rgba(75,62,48,.12);
}

.fan-card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  pointer-events:none;
}

/*
  正面原始圖片是 16:9
  需要旋轉 90 度成為 9:16
*/
.fan-card .front-img{
  position:absolute;
  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;
  max-height:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);

  object-fit:contain;
}

/*
  背面：
  維持我們剛剛確認的 A 版本
  不旋轉
  完整顯示
*/
.fan-card .back-img{
  position:absolute;
  left:50%;
  top:50%;

  width:100%;
  height:100%;

  object-fit:contain;

  transform:translate(-50%,-50%);
}

/* =========================
   FLYING CARD
========================= */

.fly-layer{
  position:fixed;
  inset:0;
  z-index:1000;

  pointer-events:none;

  display:none;
}

.fly-layer.active{
  display:block;
}

/*
  這張牌不是一開始就存在。
  只有點擊某張牌後，
  才從原本位置飛到中央。
*/
.flying-card{
  position:fixed;

  width:calc(50vh * 9 / 16);
  height:50vh;

  border-radius:9px;
  overflow:hidden;

  background:#eee8df;

  box-shadow:
    0 30px 80px rgba(55,45,36,.28),
    0 8px 20px rgba(55,45,36,.15);

  transform-origin:center center;

  transition:
    left .85s cubic-bezier(.18,.86,.25,1),
    top .85s cubic-bezier(.18,.86,.25,1),
    width .85s cubic-bezier(.18,.86,.25,1),
    height .85s cubic-bezier(.18,.86,.25,1),
    transform .85s cubic-bezier(.18,.86,.25,1);

  pointer-events:auto;

  cursor:pointer;
}

/* 牌面 */
.card-inner{
  position:absolute;
  inset:0;

  transform-style:preserve-3d;

  transition:
    transform .75s cubic-bezier(.2,.75,.2,1);
}

.flying-card.flipped .card-inner{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  background:#eee8df;
}

/* 正面 */
.card-front{
  transform:rotateY(0deg);
}

.card-front img{
  position:absolute;
  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;
  max-height:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);

  object-fit:contain;

  pointer-events:none;
}

/* 背面 */
.card-back{
  transform:rotateY(180deg);
}

.card-back img{
  position:absolute;
  left:50%;
  top:50%;

  width:100%;
  height:100%;

  object-fit:contain;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

/* 中央牌下面的提示 */
.center-hint{
  position:fixed;
  z-index:1001;

  left:50%;
  bottom:5vh;

  transform:translateX(-50%);

  font-size:12px;
  letter-spacing:.18em;

  color:rgba(75,65,56,.65);

  pointer-events:none;

  opacity:0;
  transition:opacity .5s ease;
}

.center-hint.show{
  opacity:1;
}

/* =========================
   DRAW AGAIN
========================= */

.draw-again{
  position:fixed;
  z-index:1002;

  left:50%;
  bottom:8vh;

  transform:translateX(-50%);

  border:1px solid rgba(130,110,92,.35);
  background:rgba(250,247,241,.92);

  color:#665b50;

  padding:11px 26px;

  border-radius:30px;

  font-size:13px;
  letter-spacing:.14em;

  cursor:pointer;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .35s ease,
    background .25s ease,
    transform .25s ease;
}

.draw-again.show{
  opacity:1;
  pointer-events:auto;
}

.draw-again:hover{
  background:#fff;
  transform:translateX(-50%) translateY(-2px);
}

/* =========================
   NAV
========================= */

.nav{
  position:absolute;
  z-index:30;

  right:30px;
  top:30px;

  display:flex;
  gap:20px;
}

.nav a{
  color:#807469;
  text-decoration:none;

  font-size:12px;
  letter-spacing:.12em;

  transition:color .25s ease;
}

.nav a:hover{
  color:#4f463d;
}

/* =========================
   GALLERY
========================= */

.section{
  padding:100px 5vw;
  background:#f7f3ed;
}

.section-title{
  text-align:center;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    serif;

  font-size:32px;
  font-weight:500;

  letter-spacing:.15em;

  color:#554c43;
}

.section-desc{
  text-align:center;

  margin-top:15px;

  font-size:13px;
  letter-spacing:.1em;

  color:#968a7e;
}

.gallery{
  width:100%;
  max-width:1500px;

  margin:60px auto 0;

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(150px,1fr));

  gap:24px;
}

.gallery-card{
  position:relative;

  aspect-ratio:9/16;

  overflow:hidden;

  border-radius:6px;

  background:#ebe5dc;

  box-shadow:
    0 6px 18px rgba(70,60,50,.10);
}

.gallery-card img{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;
}

.gallery-card .gallery-front{
  position:absolute;
  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);
}

/* =========================
   ABOUT
========================= */

.about{
  background:#eee7dd;

  padding:110px 8vw;

  text-align:center;
}

.about-inner{
  max-width:760px;
  margin:0 auto;
}

.about p{
  margin-top:35px;

  line-height:2.1;

  font-size:15px;

  color:#71675d;

  letter-spacing:.08em;
}

/* =========================
   FOOTER
========================= */

footer{
  padding:40px 20px;

  text-align:center;

  background:#e6ded3;

  color:#94877b;

  font-size:11px;

  letter-spacing:.12em;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .hero{
    min-height:680px;
  }

  .hero-content{
    top:5vh;
  }

  .title{
    font-size:28px;
  }

  .subtitle{
    font-size:11px;
  }

  .fan-area{
    top:20vh;
    bottom:-3vh;
  }

  .fan-card{
    height:50vh;
    width:calc(50vh * 9 / 16);
  }

  .flying-card{
    height:50vh;
    width:calc(50vh * 9 / 16);
  }

  .nav{
    top:auto;
    right:auto;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
  }

  .nav a{
    font-size:11px;
  }

  .gallery{
    grid-template-columns:
      repeat(3,1fr);

    gap:10px;
  }

  .section{
    padding:75px 18px;
  }

  .about{
    padding:80px 25px;
  }

  .draw-again{
    bottom:3vh;
  }
}
</style>
</head>

<body>

<!-- =========================
     HERO
========================= -->

<section class="hero" id="home">

  <div class="nav">
    <a href="#home">拾光卡</a>
    <a href="#gallery">作品</a>
    <a href="#about">關於</a>
  </div>

  <div class="hero-content">

    <div class="kicker">
      GUANG JHENG JUNIOR HIGH SCHOOL
    </div>

    <h1 class="title">
      光正‧拾光卡
    </h1>

    <div class="subtitle">
      69道光，陪你走一段路。
    </div>

    <div class="hint">
      點一張牌，讓它來到你面前。
    </div>

  </div>

  <!-- 69張牌 -->
  <div class="fan-area">
    <div class="fan" id="fan"></div>
  </div>

</section>


<!-- =========================
     FLYING CARD
========================= -->

<div class="fly-layer" id="flyLayer">

  <div class="flying-card" id="flyingCard">

    <div class="card-inner">

      <div class="card-face card-front">
        <img id="flyingFront" src="" alt="">
      </div>

      <div class="card-face card-back">
        <img id="flyingBack" src="" alt="">
      </div>

    </div>

  </div>

</div>

<div class="center-hint" id="centerHint">
  點擊牌卡翻面
</div>

<button
  class="draw-again"
  id="drawAgain">
  再抽一張
</button>


<!-- =========================
     GALLERY
========================= -->

<section class="section" id="gallery">

  <h2 class="section-title">
    69張拾光
  </h2>

  <p class="section-desc">
    每一張，都是光正孩子留給校園的一道光。
  </p>

  <div class="gallery" id="galleryGrid"></div>

</section>


<!-- =========================
     ABOUT
========================= -->

<section class="about" id="about">

  <div class="about-inner">

    <h2 class="section-title">
      關於拾光卡
    </h2>

    <p>
      這一套牌卡，從校園出發，也從孩子的創意開始。
      光正國中視覺藝術老師帶領畢業生，
      將校園景物與生活記憶融入視覺藝術課程。
      學生透過攝影與 iPad 數位繪圖，
      將熟悉的校園風景轉化為獨具特色的牌卡圖像。
    </p>

    <p>
      69張牌卡，收藏的不只是影像，
      也是青春、記憶，以及送給未來自己的話。
    </p>

  </div>

</section>


<footer>
  光正國中 × 光正‧拾光卡
</footer>


<script>

/* =====================================================
   基本設定
===================================================== */

const TOTAL_CARDS = 69;

const fan = document.getElementById("fan");

const flyLayer = document.getElementById("flyLayer");
const flyingCard = document.getElementById("flyingCard");

const flyingFront = document.getElementById("flyingFront");
const flyingBack = document.getElementById("flyingBack");

const centerHint = document.getElementById("centerHint");
const drawAgain = document.getElementById("drawAgain");

const galleryGrid = document.getElementById("galleryGrid");

let selectedIndex = null;
let selectedFanCard = null;


/* =====================================================
   建立 69 張牌
===================================================== */

function createFanCards(){

  fan.innerHTML = "";

  for(let i = 1; i <= TOTAL_CARDS; i++){

    const frontNumber = i * 2 - 1;
    const backNumber = i * 2;

    const card = document.createElement("div");

    card.className = "fan-card";

    card.dataset.index = i;

    card.innerHTML = `
      <img
        class="front-img"
        src="${frontNumber}.jpg"
        alt="拾光卡 ${i}"
        draggable="false"
      >
    `;

    card.addEventListener("click", function(e){

      e.stopPropagation();

      if(selectedIndex !== null){
        return;
      }

      selectCard(card, i);

    });

    fan.appendChild(card);
  }

  arrangeFan();
}


/* =====================================================
   扇形排列
===================================================== */

function arrangeFan(){

  const cards = [...document.querySelectorAll(".fan-card")];

  const total = cards.length;

  /*
    中間較高
    左右慢慢下降
    形成大型弧形牌陣
  */

  cards.forEach((card,index)=>{

    const t =
      total === 1
      ? 0
      : index / (total - 1);

    /*
      -1 → 左
       0 → 中
       1 → 右
    */
    const x = (t - 0.5) * 96;

    /*
      弧形：
      中間比較高
      兩側稍微低
    */
    const arc = Math.pow(
      Math.abs(t - 0.5) * 2,
      2
    );

    const y = arc * 15;

    /*
      左右旋轉
    */
    const angle =
      (t - 0.5) * 72;

    /*
      讓中間牌稍微在上層
    */
    const distance =
      Math.abs(t - 0.5);

    const z =
      100 - Math.round(distance * 50) + index;

    card.style.zIndex = z;

    card.style.transform =
      `translate(
        calc(-50% + ${x}vw),
        calc(-50% + ${y}vh)
      )
      rotate(${angle}deg)`;
  });
}


/* =====================================================
   點牌 → 飛到中央
===================================================== */

function selectCard(card,index){

  selectedIndex = index;
  selectedFanCard = card;

  const frontNumber = index * 2 - 1;
  const backNumber = index * 2;

  /*
    先取得牌目前在畫面上的實際位置
  */
  const rect = card.getBoundingClientRect();

  /*
    建立中央牌
  */
  flyingFront.src = `${frontNumber}.jpg`;
  flyingBack.src = `${backNumber}.jpg`;

  /*
    先讓飛行牌與原牌完全重疊
  */
  flyingCard.style.left =
    `${rect.left}px`;

  flyingCard.style.top =
    `${rect.top}px`;

  flyingCard.style.width =
    `${rect.width}px`;

  flyingCard.style.height =
    `${rect.height}px`;

  flyingCard.style.transform =
    `rotate(0deg)`;

  flyingCard.classList.remove("flipped");

  flyLayer.classList.add("active");

  /*
    原本那張牌暫時隱藏
  */
  card.style.opacity = "0";
  card.style.pointerEvents = "none";

  /*
    強制瀏覽器先完成初始位置
  */
  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      moveCardToCenter();

    });

  });
}


/* =====================================================
   飛到中央
===================================================== */

function moveCardToCenter(){

  const vh = window.innerHeight;
  const vw = window.innerWidth;

  const targetHeight =
    vh * 0.50;

  const targetWidth =
    targetHeight * 9 / 16;

  const left =
    (vw - targetWidth) / 2;

  const top =
    (vh - targetHeight) / 2 + 25;

  flyingCard.style.left =
    `${left}px`;

  flyingCard.style.top =
    `${top}px`;

  flyingCard.style.width =
    `${targetWidth}px`;

  flyingCard.style.height =
    `${targetHeight}px`;

  flyingCard.style.transform =
    `rotate(0deg)`;

  setTimeout(()=>{

    centerHint.classList.add("show");
    drawAgain.classList.add("show");

  },850);
}


/* =====================================================
   中央牌 → 翻面
===================================================== */

flyingCard.addEventListener("click",function(){

  if(selectedIndex === null){
    return;
  }

  flyingCard.classList.toggle("flipped");

  centerHint.textContent =
    flyingCard.classList.contains("flipped")
    ? "再點一次翻回正面"
    : "點擊牌卡翻面";

});


/* =====================================================
   再抽一張
===================================================== */

drawAgain.addEventListener("click",function(e){

  e.stopPropagation();

  resetSelectedCard();

});


/* =====================================================
   回到 69 張牌陣
===================================================== */

function resetSelectedCard(){

  /*
    隱藏提示
  */
  centerHint.classList.remove("show");

  drawAgain.classList.remove("show");

  /*
    先讓中央牌縮回原本牌卡的位置
  */
  if(selectedFanCard){

    const rect =
      selectedFanCard.getBoundingClientRect();

    flyingCard.style.left =
      `${rect.left}px`;

    flyingCard.style.top =
      `${rect.top}px`;

    flyingCard.style.width =
      `${rect.width}px`;

    flyingCard.style.height =
      `${rect.height}px`;

    flyingCard.style.transform =
      `rotate(0deg)`;

  }

  setTimeout(()=>{

    flyLayer.classList.remove("active");

    flyingCard.classList.remove("flipped");

    if(selectedFanCard){

      selectedFanCard.style.opacity = "1";
      selectedFanCard.style.pointerEvents = "auto";

    }

    selectedFanCard = null;
    selectedIndex = null;

  },850);
}


/* =====================================================
   Gallery
===================================================== */

function createGallery(){

  galleryGrid.innerHTML = "";

  for(let i=1;i<=TOTAL_CARDS;i++){

    const frontNumber =
      i * 2 - 1;

    const item =
      document.createElement("div");

    item.className =
      "gallery-card";

    item.innerHTML = `
      <img
        class="gallery-front"
        src="${frontNumber}.jpg"
        alt="拾光卡 ${i}"
        loading="lazy"
        draggable="false"
      >
    `;

    galleryGrid.appendChild(item);

  }

}


/* =====================================================
   視窗尺寸改變
===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(selectedIndex === null){

      arrangeFan();

    }else{

      moveCardToCenter();

    }

  }
);


/* =====================================================
   啟動
===================================================== */

createFanCards();

createGallery();

</script>

</body>
</html>
