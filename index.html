<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>光正‧拾光卡｜69道光，陪你走一段路。</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  background:#f4efe7;
  color:#554c43;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overflow-x:hidden;
}

/* =========================
   首頁
========================= */

.hero{
  position:relative;
  width:100%;
  height:100vh;
  min-height:720px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 35%,
      #fffdf9,
      #f4efe7 60%,
      #ebe3d8
    );
}

.hero-content{
  position:absolute;
  z-index:20;
  top:5vh;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  text-align:center;
  pointer-events:none;
}

.kicker{
  font-size:12px;
  letter-spacing:.25em;
  color:#9a8d80;
}

.title{
  margin-top:10px;
  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PMingLiU",
    serif;
  font-size:clamp(30px,4vw,50px);
  font-weight:500;
  letter-spacing:.12em;
}

.subtitle{
  margin-top:10px;
  font-size:13px;
  letter-spacing:.16em;
  color:#95897d;
}

.hint{
  margin-top:12px;
  font-size:12px;
  letter-spacing:.12em;
  color:#aa9e92;
}


/* =========================
   69 張牌扇形
========================= */

.fan-area{
  position:absolute;
  left:0;
  right:0;
  top:18vh;
  bottom:-3vh;
  overflow:visible;
}

.fan{
  position:absolute;
  inset:0;
  overflow:visible;
}

.fan-card{
  position:absolute;

  left:50%;
  top:58%;

  width:calc(50vh * 9 / 16);
  height:50vh;

  border-radius:8px;
  overflow:hidden;

  background:#eee8df;

  box-shadow:
    0 10px 25px rgba(60,50,40,.16);

  cursor:pointer;

  transform-origin:50% 92%;

  transition:
    transform .28s cubic-bezier(.2,.85,.2,1),
    box-shadow .28s,
    filter .28s;

  will-change:transform;

  user-select:none;
}

.fan-card img{
  pointer-events:none;
}


/* 正面圖片
   原始圖片 16:9
   旋轉 90° → 9:16
*/

.front-img{
  position:absolute;

  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);

  display:block;
}


/* =========================
   滑鼠移上牌卡
========================= */

.fan-card.hover-lift{
  filter:brightness(1.08);

  box-shadow:
    0 28px 55px rgba(55,45,35,.32),
    0 8px 18px rgba(55,45,35,.18);

  z-index:9998 !important;
}


/* =========================
   被選取的牌
========================= */

.fan-card.is-selected{
  z-index:9999 !important;
  transition:none;
}


/* =========================
   飛到中央的牌
========================= */

.fly-layer{
  position:fixed;
  inset:0;

  z-index:1000;

  pointer-events:none;

  display:none;
}

.fly-layer.active{
  display:block;
}

.flying-card{
  position:fixed;

  width:calc(50vh * 9 / 16);
  height:50vh;

  border-radius:9px;
  overflow:hidden;

  background:#eee8df;

  box-shadow:
    0 30px 80px rgba(55,45,36,.28),
    0 8px 20px rgba(55,45,36,.15);

  transform-origin:center;

  transition:
    left .8s cubic-bezier(.18,.86,.25,1),
    top .8s cubic-bezier(.18,.86,.25,1),
    width .8s cubic-bezier(.18,.86,.25,1),
    height .8s cubic-bezier(.18,.86,.25,1);

  pointer-events:auto;

  cursor:pointer;
}


/* =========================
   3D 翻牌
========================= */

.card-inner{
  position:absolute;
  inset:0;

  transform-style:preserve-3d;

  transition:
    transform .75s cubic-bezier(.2,.75,.2,1);
}

.flying-card.flipped .card-inner{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;

  overflow:hidden;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  background:#eee8df;
}


/* 正面 */

.card-front img{
  position:absolute;

  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);
}


/* =========================
   背面
   注意：不旋轉
========================= */

.card-back{
  transform:rotateY(180deg);
}

.card-back img{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:100%;

  object-fit:contain;

  transform:translate(-50%,-50%);
}


/* =========================
   ↻ 翻牌提示
========================= */

.flip-hint{
  position:fixed;

  z-index:1002;

  left:50%;
  top:50%;

  transform:
    translate(
      calc(-50% + 150px),
      calc(-50% + 220px)
    );

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;

  opacity:0;

  pointer-events:none;

  transition:opacity .35s ease;
}

.flip-hint.show{
  opacity:1;
}

.flip-icon{
  width:42px;
  height:42px;

  border:1px solid rgba(120,105,90,.45);

  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(250,247,241,.92);

  font-size:22px;
  color:#76695d;

  animation:
    flipSpin 2.2s ease-in-out infinite;

  box-shadow:
    0 5px 14px rgba(70,55,42,.12);
}

.flip-label{
  font-size:10px;
  letter-spacing:.14em;
  color:#807469;
  white-space:nowrap;
}

@keyframes flipSpin{

  0%,100%{
    transform:rotate(0deg) scale(1);
  }

  45%{
    transform:rotate(180deg) scale(1.06);
  }

  55%{
    transform:rotate(180deg) scale(1.06);
  }

}


/* =========================
   中央提示
========================= */

.center-hint{
  position:fixed;

  z-index:1001;

  left:50%;
  bottom:5vh;

  transform:translateX(-50%);

  font-size:12px;
  letter-spacing:.16em;

  color:rgba(75,65,56,.65);

  opacity:0;

  transition:opacity .4s;

  pointer-events:none;
}

.center-hint.show{
  opacity:1;
}


/* =========================
   再抽一張
========================= */

.draw-again{
  position:fixed;

  z-index:1002;

  left:50%;
  bottom:8vh;

  transform:translateX(-50%);

  border:
    1px solid rgba(130,110,92,.35);

  background:
    rgba(250,247,241,.94);

  color:#665b50;

  padding:11px 26px;

  border-radius:30px;

  font-size:13px;
  letter-spacing:.14em;

  cursor:pointer;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .35s,
    transform .25s;
}

.draw-again.show{
  opacity:1;
  pointer-events:auto;
}

.draw-again:hover{
  transform:
    translateX(-50%)
    translateY(-2px);
}


/* =========================
   Gallery
========================= */

.section{
  padding:100px 5vw;
  background:#f7f3ed;
}

.section-title{
  text-align:center;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    serif;

  font-size:32px;

  font-weight:500;

  letter-spacing:.15em;

  color:#554c43;
}

.section-desc{
  text-align:center;

  margin-top:15px;

  font-size:13px;

  letter-spacing:.1em;

  color:#968a7e;
}

.gallery{
  width:100%;
  max-width:1500px;

  margin:60px auto 0;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(150px,1fr)
    );

  gap:24px;
}

.gallery-card{
  position:relative;

  aspect-ratio:9/16;

  overflow:hidden;

  border-radius:6px;

  background:#ebe5dc;

  box-shadow:
    0 6px 18px rgba(70,60,50,.1);
}

.gallery-card img{
  display:block;
}

.gallery-front{
  position:absolute;

  left:50%;
  top:50%;

  width:177.7778%;
  height:auto;

  max-width:none;

  transform:
    translate(-50%,-50%)
    rotate(90deg);
}


/* =========================
   About
========================= */

.about{
  background:#eee7dd;

  padding:110px 8vw;

  text-align:center;
}

.about-inner{
  max-width:760px;
  margin:0 auto;
}

.about p{
  margin-top:35px;

  line-height:2.1;

  font-size:15px;

  color:#71675d;

  letter-spacing:.08em;
}


/* =========================
   Footer
========================= */

footer{
  padding:40px 20px;

  text-align:center;

  background:#e6ded3;

  color:#94877b;

  font-size:11px;

  letter-spacing:.12em;
}


/* =========================
   手機版
========================= */

@media(max-width:700px){

  .hero{
    min-height:680px;
  }

  .fan-area{
    top:20vh;
  }

  .fan-card,
  .flying-card{
    height:50vh;
    width:calc(50vh * 9 / 16);
  }

  .flip-hint{
    transform:
      translate(
        calc(-50% + 95px),
        calc(-50% + 220px)
      );
  }

  .gallery{
    grid-template-columns:
      repeat(3,1fr);

    gap:10px;
  }

  .section{
    padding:75px 18px;
  }

  .about{
    padding:80px 25px;
  }

  .draw-again{
    bottom:3vh;
  }

}
</style>
</head>


<body>


<!-- =====================================
     首頁／69張牌
===================================== -->

<section class="hero" id="home">

  <div class="hero-content">

    <div class="kicker">
      GUANG JHENG JUNIOR HIGH SCHOOL
    </div>

    <h1 class="title">
      光正‧拾光卡
    </h1>

    <div class="subtitle">
      69道光，陪你走一段路。
    </div>

    <div class="hint">
      點一張牌，讓它來到你面前。
    </div>

  </div>


  <div class="fan-area">

    <div
      class="fan"
      id="fan">
    </div>

  </div>

</section>


<!-- =====================================
     飛到中央的牌
===================================== -->

<div
  class="fly-layer"
  id="flyLayer">

  <div
    class="flying-card"
    id="flyingCard">

    <div class="card-inner">

      <div
        class="card-face card-front">

        <img
          id="flyingFront"
          alt="拾光卡正面">

      </div>


      <div
        class="card-face card-back">

        <img
          id="flyingBack"
          alt="拾光卡背面">

      </div>

    </div>

  </div>

</div>


<!-- =====================================
     翻牌提示
===================================== -->

<div
  class="flip-hint"
  id="flipHint">

  <div class="flip-icon">
    ↻
  </div>

  <div class="flip-label">
    點擊翻牌
  </div>

</div>


<div
  class="center-hint"
  id="centerHint">

  點擊牌卡翻面

</div>


<button
  class="draw-again"
  id="drawAgain">

  再抽一張

</button>


<!-- =====================================
     Gallery
===================================== -->

<section
  class="section"
  id="gallery">

  <h2 class="section-title">
    69張拾光
  </h2>

  <p class="section-desc">
    每一張，都是光正孩子留給校園的一道光。
  </p>

  <div
    class="gallery"
    id="galleryGrid">
  </div>

</section>


<!-- =====================================
     About
===================================== -->

<section
  class="about"
  id="about">

  <div class="about-inner">

    <h2 class="section-title">
      關於拾光卡
    </h2>

    <p>
      這一套牌卡，從校園出發，也從孩子的創意開始。
    </p>

    <p>
      光正國中學生將熟悉的校園景物與生活記憶，
      轉化為一張張獨具特色的視覺作品。
    </p>

    <p>
      69張牌卡，收藏的不只是影像，
      也是青春、記憶，以及送給未來自己的話。
    </p>

  </div>

</section>


<footer>
  光正國中 × 光正‧拾光卡
</footer>


<script>

/* =====================================
   基本設定
===================================== */

const TOTAL = 69;

const fan =
  document.getElementById("fan");

const flyLayer =
  document.getElementById("flyLayer");

const flyingCard =
  document.getElementById("flyingCard");

const flyingFront =
  document.getElementById("flyingFront");

const flyingBack =
  document.getElementById("flyingBack");

const flipHint =
  document.getElementById("flipHint");

const centerHint =
  document.getElementById("centerHint");

const drawAgain =
  document.getElementById("drawAgain");

const galleryGrid =
  document.getElementById("galleryGrid");


let selectedIndex = null;

let selectedFanCard = null;


/*
  GitHub 圖片位置
*/

const RAW =
  "https://raw.githubusercontent.com/dance661-max/guangzheng-shiguang-card/main/";


/* =====================================
   69張牌的扇形排列
===================================== */

function arrangeFan(){

  const cards =
    [...document.querySelectorAll(".fan-card")];

  cards.forEach((card,index)=>{

    const t =
      index / (TOTAL - 1);

    /*
      左右水平展開
    */

    const x =
      (t - .5) * 96;


    /*
      中間高、左右低
    */

    const arc =
      Math.pow(
        Math.abs(t - .5) * 2,
        2
      );

    const y =
      arc * 15;


    /*
      扇形旋轉角度
    */

    const angle =
      (t - .5) * 72;


    /*
      層次
    */

    const z =
      100 -
      Math.round(
        Math.abs(t - .5) * 50
      ) +
      index;


    card.style.zIndex = z;


    card.dataset.baseTransform =
      `translate(
        calc(-50% + ${x}vw),
        calc(-50% + ${y}vh)
      )
      rotate(${angle}deg)`;


    card.style.transform =
      card.dataset.baseTransform;

  });

}


/* =====================================
   建立69張牌
===================================== */

function createFanCards(){

  for(
    let i = 1;
    i <= TOTAL;
    i++
  ){

    const frontNumber =
      i * 2 - 1;


    const card =
      document.createElement("div");


    card.className =
      "fan-card";


    card.dataset.index =
      i;


    card.innerHTML = `
      <img
        class="front-img"
        src="${RAW}${frontNumber}.jpg"
        alt="拾光卡 ${i}"
        draggable="false">
    `;


    /*
      滑鼠移入：
      明顯往上凸
    */

    card.addEventListener(
      "mouseenter",
      ()=>{

        if(
          selectedIndex !== null
        ){
          return;
        }


        card.classList.add(
          "hover-lift"
        );


        card.style.transform =
          `${card.dataset.baseTransform}
           translateY(-38px)
           scale(1.07)`;

      }
    );


    /*
      滑鼠移出
    */

    card.addEventListener(
      "mouseleave",
      ()=>{

        if(
          selectedIndex !== null
        ){
          return;
        }


        card.classList.remove(
          "hover-lift"
        );


        card.style.transform =
          card.dataset.baseTransform;

      }
    );


    /*
      點擊牌卡
    */

    card.addEventListener(
      "click",
      ()=>{
        selectCard(
          card,
          i
        );
      }
    );


    fan.appendChild(card);

  }


  arrangeFan();

}


/* =====================================
   點牌
===================================== */

function selectCard(
  card,
  index
){

  if(
    selectedIndex !== null
  ){
    return;
  }


  selectedIndex =
    index;


  selectedFanCard =
    card;


  card.classList.add(
    "is-selected"
  );


  card.classList.remove(
    "hover-lift"
  );


  const rect =
    card.getBoundingClientRect();


  /*
    設定正面與背面
  */

  flyingFront.src =
    `${RAW}${index * 2 - 1}.jpg`;


  flyingBack.src =
    `${RAW}${index * 2}.jpg`;


  flyingCard.classList.remove(
    "flipped"
  );


  /*
    飛行牌先放在原牌的位置
  */

  flyingCard.style.left =
    `${rect.left}px`;

  flyingCard.style.top =
    `${rect.top}px`;

  flyingCard.style.width =
    `${rect.width}px`;

  flyingCard.style.height =
    `${rect.height}px`;


  flyLayer.classList.add(
    "active"
  );


  /*
    點擊後再凸起一次
  */

  card.style.transition =
    "transform .28s cubic-bezier(.18,.92,.22,1),filter .28s,box-shadow .28s";


  card.style.transform =
    `${card.dataset.baseTransform}
     translateY(-38px)
     scale(1.07)`;


  card.style.filter =
    "brightness(1.08)";


  card.style.boxShadow =
    "0 28px 55px rgba(55,45,35,.32),0 8px 18px rgba(55,45,35,.18)";


  /*
    0.3秒後飛向中央
  */

  setTimeout(
    ()=>{

      card.style.opacity =
        "0";


      const h =
        innerHeight * .5;


      const w =
        h * 9 / 16;


      flyingCard.style.left =
        `${(innerWidth - w) / 2}px`;


      flyingCard.style.top =
        `${(innerHeight - h) / 2 + 25}px`;


      flyingCard.style.width =
        `${w}px`;


      flyingCard.style.height =
        `${h}px`;

    },
    300
  );


  /*
    飛到中央後才出現翻牌提示
  */

  setTimeout(
    ()=>{

      flipHint.classList.add(
        "show"
      );


      centerHint.classList.add(
        "show"
      );


      drawAgain.classList.add(
        "show"
      );

    },
    1150
  );

}


/* =====================================
   點中央牌 → 3D翻牌
===================================== */

flyingCard.addEventListener(
  "click",
  ()=>{

    if(
      selectedIndex === null
    ){
      return;
    }


    flyingCard.classList.toggle(
      "flipped"
    );


    /*
      已翻面
    */

    if(
      flyingCard.classList.contains(
        "flipped"
      )
    ){

      flipHint.classList.remove(
        "show"
      );


      centerHint.textContent =
        "再點一次翻回正面";

    }


    /*
      回到正面
    */

    else{

      flipHint.classList.add(
        "show"
      );


      centerHint.textContent =
        "點擊牌卡翻面";

    }

  }
);


/* =====================================
   再抽一張
===================================== */

drawAgain.addEventListener(
  "click",
  (event)=>{

    event.stopPropagation();

    resetCard();

  }
);


/* =====================================
   回到69張牌陣
===================================== */

function resetCard(){

  if(
    !selectedFanCard
  ){
    return;
  }


  flipHint.classList.remove(
    "show"
  );


  centerHint.classList.remove(
    "show"
  );


  drawAgain.classList.remove(
    "show"
  );


  /*
    飛回原來的位置
  */

  const rect =
    selectedFanCard.getBoundingClientRect();


  flyingCard.style.left =
    `${rect.left}px`;


  flyingCard.style.top =
    `${rect.top}px`;


  flyingCard.style.width =
    `${rect.width}px`;


  flyingCard.style.height =
    `${rect.height}px`;


  setTimeout(
    ()=>{

      flyLayer.classList.remove(
        "active"
      );


      flyingCard.classList.remove(
        "flipped"
      );


      selectedFanCard.style.opacity =
        "1";


      selectedFanCard.style.filter =
        "";


      selectedFanCard.style.boxShadow =
        "";


      selectedFanCard.style.transition =
        "";


      selectedFanCard.style.transform =
        selectedFanCard.dataset.baseTransform;


      selectedFanCard.classList.remove(
        "is-selected"
      );


      selectedFanCard =
        null;


      selectedIndex =
        null;

    },
    820
  );

}


/* =====================================
   Gallery
===================================== */

function createGallery(){

  for(
    let i = 1;
    i <= TOTAL;
    i++
  ){

    const frontNumber =
      i * 2 - 1;


    const item =
      document.createElement("div");


    item.className =
      "gallery-card";


    item.innerHTML = `
      <img
        class="gallery-front"
        src="${RAW}${frontNumber}.jpg"
        alt="拾光卡 ${i}"
        loading="lazy">
    `;


    galleryGrid.appendChild(
      item
    );

  }

}


/* =====================================
   視窗尺寸改變
===================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(
      selectedIndex === null
    ){

      arrangeFan();

    }

  }
);


/* =====================================
   啟動
===================================== */

createFanCards();

createGallery();

</script>

</body>
</html>
